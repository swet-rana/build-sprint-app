<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fictional 390px error check</title></head><body><main id="app"><div class="intro"><h1>My health summary</h1></div><div id="summary-view"></div></main>
<script type="module">
import {guardTestTarget} from './test-target.js';
guardTestTarget(import.meta.env.VITE_CONVEX_URL,{script:'phone-error-frame.html',allowProd:new URL(window.location.href).searchParams.has('--allow-prod')});
guardTestTarget(window.location.origin,{script:'phone-error-frame.html',allowProd:new URL(window.location.href).searchParams.has('--allow-prod')});

await Promise.all([import('/src/style.css'),import('/src/summary.css'),import('/src/summary-premium.css'),import('/src/typography.css')]);const {mountAnalysis}=await import('/src/analysis.js');
if(localStorage.getItem('health-history-upload-session'))throw Error('Use a fresh local origin for this fictional check.');const originalFetch=window.fetch;window.fetch=async(url,opts)=>{if(String(url).endsWith('/reports/open')){const {reportId}=JSON.parse(opts.body);if(reportId==='bad')return new Response('%PDF-1.7\n',{headers:{'Content-Type':'application/pdf'}});const response=await originalFetch('/tests/fixtures/blood-sample-july.pdf');return new Response(await response.arrayBuffer(),{headers:{'Content-Type':'application/pdf'}});}return originalFetch(url,opts);};
const analysis=mountAnalysis(document.querySelector('#summary-view'),()=>{});analysis.updateReports([{id:'bad',serial:1,name:'fictional-corrupt-report-with-a-long-phone-filename.pdf',contentType:'application/pdf',size:12},{id:'good',serial:2,name:'fictional-readable-report.pdf',contentType:'application/pdf',size:1000}],['bad','good']);await analysis.prepare();
</script></body></html>
