<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/typography.css"><title>Hits and Misses — fictional dev reports</title></head><body><button id="start">Test two reports and one report</button><button id="next" hidden>Continue test</button><pre id="events" style="white-space:pre-wrap"></pre><div id="app"><main><section id="summary-view"><div id="analysis"></div></section></main></div><script type="module">
import {guardTestTarget} from './test-target.js';
const url=guardTestTarget(import.meta.env.VITE_CONVEX_URL,{script:'hits-misses-browser.html',devOnly:true});guardTestTarget(location.origin,{script:'hits-misses-browser.html',devOnly:true});
await Promise.all([import('/src/style.css'),import('/src/glass.css'),import('/src/typography.css'),import('/src/summary-premium.css')]);const [{mountAnalysis},{authClient},{getFunctionName}]=await Promise.all([import('/src/analysis.js'),import('/src/auth-client.js'),import('convex/server')]);
const root=document.querySelector('#analysis'),client=authClient(),lines=[];function log(line){lines.push(line);document.querySelector('#events').textContent=lines.join('\n');}
const pause=label=>new Promise(resolve=>{const next=document.querySelector('#next');next.textContent=label;next.hidden=false;next.onclick=()=>{next.hidden=true;resolve();};});
document.querySelector('#start').onclick=async()=>{
 document.querySelector('#start').disabled=true;const realAction=client.action.bind(client);let smartCalls=0,failSmart=false;
 client.action=(ref,args)=>{if(getFunctionName(ref)==='smartSummary:write'){smartCalls++;if(failSmart)throw Error('Fictional transport outage');}return realAction(ref,args);};
 try{
 log('START: development only; two fictional text PDFs; existing report reader and saved summary logs.');
 const sessionKey=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('health-history-upload-session',sessionKey);const reports=[];
 for(const month of ['january','july']){const name='hits-misses-'+month+'.pdf',bytes=await(await fetch('/tests/fixtures/'+name)).blob(),form=new FormData();form.set('sessionKey',sessionKey);form.set('uploadId',crypto.randomUUID());form.set('file',new File([bytes],name,{type:'application/pdf'}));const response=await fetch(url.replace('.cloud','.site')+'/reports/upload',{method:'POST',body:form});if(!response.ok)throw Error('Upload failed');reports.push({id:(await response.json()).reportId,name,serial:reports.length+1,contentType:'application/pdf',size:bytes.size});}
 const analysis=mountAnalysis(root,()=>{});analysis.updateReports(reports,reports.map(r=>r.id));await analysis.prepare();
 const verify=single=>{const panel=root.querySelector('.smart-summary');if(!root.querySelector('.real-summary-paper')||!panel||panel.querySelector('.smart-summary-unavailable'))throw Error('Smart summary unavailable');if(!panel.textContent.includes('This is not medical advice; discuss with your doctor.'))throw Error('Disclaimer missing');const hit=panel.querySelector('[aria-label="Hits"]'),miss=panel.querySelector('[aria-label="Misses"]');if(hit.querySelectorAll('li').length!==2||miss.querySelectorAll('li').length!==1)throw Error('Wrong Hits/Misses grouping');if(!miss.textContent.includes('Vitamin D'))throw Error('Out-of-range result absent from Misses');for(const item of panel.querySelectorAll('.smart-summary-columns li')){if(!item.querySelector('.source-button'))throw Error('Source link missing');for(const source of item.querySelectorAll('[data-source]'))if(!reports.some(r=>r.id===source.dataset.source)||Number(source.dataset.page)<1)throw Error('Unknown source');}if(panel.querySelectorAll('.smart-summary-questions li').length>3)throw Error('Too many questions');if(single&&!panel.textContent.includes('A trend appears once a second report is added.'))throw Error('Single-report trend note missing');if(single&&panel.querySelectorAll('.smart-summary-columns li .source-button').length!==3)throw Error('A single report invented a trend source');return panel;};
 verify(false);if(smartCalls!==1)throw Error('Expected one server smart-summary call');log('PASS: two-report summary; 2 Hits, 1 Miss; every item links to extracted source report/page.');log('PASS: clinician questions capped at 3; exact medical-advice notice visible; no patient identity sent to the writing model.');
 const sample=root.querySelector('.smart-summary');log('SAMPLE BEGIN');for(const group of ['Hits','Misses']){log(group);for(const li of sample.querySelectorAll('[aria-label="'+group+'"] li')){log(li.querySelector('p').textContent);for(const span of li.querySelectorAll('.smart-summary-sources > span'))log(span.textContent.trim());}}log('Questions for your doctor');for(const li of sample.querySelectorAll('.smart-summary-questions li'))log(li.textContent);log(sample.querySelector('.smart-summary-disclaimer').textContent);log('SAMPLE END');await pause('Continue with one report');
 analysis.updateReports(reports,[reports[1].id]);if(root.querySelector('#prepare-summary').disabled)throw Error('Single-report preparation disabled');await analysis.prepare();verify(true);if(smartCalls!==2)throw Error('Single report did not use server action');log('PASS: one-report summary; 2 Hits, 1 Miss against printed ranges; no trend invented; second-report note visible.');await pause('Test smart-summary failure');
 failSmart=true;await analysis.prepare();if(!root.querySelector('.real-summary-paper')||root.querySelector('.smart-summary-unavailable')?.textContent!=='Smart summary unavailable right now')throw Error('Failure hid the plain summary');log('PASS: simulated writing-call failure preserves the plain summary and visibly says Smart summary unavailable right now.');log('PASS: report reading, OCR filter, vision limits/model and reading cache unchanged.');
 }catch(error){log('FAIL: '+error.message);}finally{client.action=realAction;}
};
</script></body></html>
