<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/typography.css"><style>html,body{height:auto!important;overflow:visible!important}#app,#app main{height:auto!important;overflow:visible!important;min-height:0!important}#test-output{margin:8px}#test-output[open]{max-height:240px;overflow:auto}</style><title>Hits and Misses — fictional dev reports</title></head><body><button id="start">Test two reports and one report</button><button id="next" hidden>Continue test</button><details id="test-output"><summary>Raw dev output</summary><pre id="events" style="white-space:pre-wrap"></pre></details><div id="app"><button id="home-tab" aria-pressed="false" hidden>Home</button><main><section id="summary-view"><div id="analysis"></div></section></main></div><script type="module">
import {guardTestTarget} from './test-target.js';
const url=guardTestTarget(import.meta.env.VITE_CONVEX_URL,{script:'hits-misses-browser.html',devOnly:true});guardTestTarget(location.origin,{script:'hits-misses-browser.html',devOnly:true});
await Promise.all([import('/src/style.css'),import('/src/glass.css'),import('/src/typography.css'),import('/src/summary-premium.css'),import('/src/inter-application.css')]);const [{mountAnalysis},{authClient},{getFunctionName}]=await Promise.all([import('/src/analysis.js'),import('/src/auth-client.js'),import('convex/server')]);
const scanMode=new URLSearchParams(location.search).get('scan')==='1';
const root=document.querySelector('#analysis'),client=authClient(),lines=[];function log(line){lines.push(line);document.querySelector('#events').textContent=lines.join('\n');}
const pause=label=>new Promise(resolve=>{const next=document.querySelector('#next');next.textContent=label;next.hidden=false;next.onclick=()=>{next.hidden=true;resolve();};});
document.querySelector('#start').onclick=async()=>{
 document.querySelector('#start').disabled=true;const realAction=client.action.bind(client);let smartCalls=0,failSmart=false;
 client.action=(ref,args)=>{if(getFunctionName(ref)==='smartSummary:write'){smartCalls++;if(failSmart)throw Error('Fictional transport outage');}return realAction(ref,args);};
 try{
 log('START: development only; '+(scanMode?'one fictional text PDF and one fictional scanned PDF':'two fictional text PDFs')+'; existing report reader and saved summary logs.');
 const sessionKey=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('health-history-upload-session',sessionKey);const reports=[];
 for(const month of ['january','july']){const name='hits-misses-'+month+'.pdf',bytes=await(await fetch('/tests/fixtures/'+(scanMode&&month==='july'?'vision-sample.pdf':name))).blob(),form=new FormData();form.set('sessionKey',sessionKey);form.set('uploadId',crypto.randomUUID());form.set('file',new File([bytes],name,{type:'application/pdf'}));const response=await fetch(url.replace('.cloud','.site')+'/reports/upload',{method:'POST',body:form});if(!response.ok)throw Error('Upload failed');reports.push({id:(await response.json()).reportId,name,serial:reports.length+1,contentType:'application/pdf',size:bytes.size});}
 const analysis=mountAnalysis(root,()=>{});analysis.updateReports(reports,reports.map(r=>r.id));await analysis.prepare();
 const verify=single=>{const panel=root.querySelector('.smart-summary');if(!root.querySelector('.real-summary-paper')||!panel||panel.querySelector('.smart-summary-unavailable'))throw Error('Smart summary unavailable');if(!panel.textContent.includes('Not a diagnosis; discuss results with your doctor.'))throw Error('Disclaimer missing');const hit=panel.querySelector('[aria-label="'+(single?'In range':'Hits')+'"]'),miss=panel.querySelector('[aria-label="'+(single?'Out of range':'Misses')+'"]');if(hit.querySelectorAll('li').length!==(single?(scanMode?2:3):(scanMode?1:2))||miss.querySelectorAll('li').length!==1)throw Error('Wrong range grouping');if(!miss.textContent.includes('Vitamin D'))throw Error('Out-of-range result absent');if(!single){const stayed=panel.querySelector('.smart-summary-stayed');if(!stayed||stayed.open||stayed.querySelectorAll('li').length!==1||!stayed.textContent.includes('Haemoglobin'))throw Error('Stayed in range must be collapsed');if(hit.textContent.includes('Haemoglobin'))throw Error('Always-normal result became a Hit');if(!miss.textContent.includes('Improved since last report'))throw Error('Improvement note missing');}for(const item of panel.querySelectorAll('.smart-summary-columns li,.smart-summary-stayed li')){if(!item.querySelector('.source-button'))throw Error('Source link missing');for(const source of item.querySelectorAll('[data-source]'))if(!reports.some(r=>r.id===source.dataset.source)||Number(source.dataset.page)<1)throw Error('Unknown source');}if(panel.querySelector('.smart-summary-questions'))throw Error('Doctor questions must not be displayed');if(single&&(!panel.textContent.includes('A trend appears once a second report is added.')||/\b(?:hits?|miss(?:es)?)\b/i.test(panel.textContent)))throw Error('Single report must use range labels only');return panel;};
 verify(false);if(smartCalls!==1)throw Error('Expected one server smart-summary call');log('PASS: two-report summary; '+(scanMode?'1 Hit':'2 Hits')+', 1 Miss; 1 Stayed in range test collapsed; unchanged groups and source report/page.');
 const panel=root.querySelector('.smart-summary');for(const item of panel.querySelectorAll('.smart-summary-items>li')){if(item.querySelectorAll('.smart-source-direct').length!==1||item.querySelector('[popover]'))throw Error('Expected one direct source per item');if(item.querySelector('.scan-value-notice'))throw Error('Repeated scan notice');}if(panel.querySelectorAll('.smart-summary-scan-note').length!==(scanMode?1:0))throw Error('Scan notice must appear once only for scan results');if(scanMode){const only=panel.querySelector('.smart-summary-only');if(!only||only.querySelectorAll('li').length!==1||!only.querySelector('.smart-range-pill')||!only.querySelector('.smart-source-direct'))throw Error('Single-report list or source missing');log('PASS: Only in one report is separate below Misses, with a status pill and original-report link.');}log('PASS: name, status pill and one direct Source per item; scan notice '+(scanMode?'shown once':'correctly absent for text-only reports')+'.');
 if(!scanMode){const triglycerides=[...root.querySelectorAll('.marker')].find(el=>el.querySelector('h4')?.textContent==='Triglycerides');if(!triglycerides)throw Error('Triglycerides absent');const dots=[...triglycerides.querySelectorAll('.result-point')];if(dots.length!==2||!dots[0].classList.contains('trend-out-of-range')||!dots[1].classList.contains('trend-normal-transition'))throw Error('Multi-band trend colours incorrect');log('PASS: Triglycerides labelled Normal band selected; earlier dot red, latest dot green; printed multi-band reference retained.');const unclear=root.querySelector('.range-unclear')?.closest('.marker');if(!unclear||!unclear.textContent.includes('range unclear, check original')||![...unclear.querySelectorAll('.result-point')].every(dot=>dot.classList.contains('trend-neutral')))throw Error('Unclear-range notice or neutral dot missing');log('PASS: unidentified reference bands stay neutral and show range unclear, check original.');}log('PASS: exact medical-advice notice visible; no patient identity sent to the writing model.');
 const sample=root.querySelector('.smart-summary');log('SAMPLE BEGIN');for(const group of ['Hits','Misses']){log(group);for(const li of sample.querySelectorAll('[aria-label="'+group+'"] li')){log(li.querySelector('.smart-result-name').textContent+' · '+li.querySelector('.smart-range-pill').textContent+(li.querySelector('.smart-result-description')?' · '+li.querySelector('.smart-result-description').textContent:''));for(const span of li.querySelectorAll('.smart-summary-sources > span'))log(span.textContent.trim());}}log('Stayed in range (collapsed)');for(const li of sample.querySelectorAll('.smart-summary-stayed li'))log(li.querySelector('.smart-result-name').textContent+' · '+li.querySelector('.smart-range-pill').textContent+(li.querySelector('.smart-result-description')?' · '+li.querySelector('.smart-result-description').textContent:''));log(sample.querySelector('.smart-summary-disclaimer').textContent);log('SAMPLE END');await pause('Continue with one report');
 analysis.updateReports(reports,[reports[1].id]);if(root.querySelector('#prepare-summary').disabled)throw Error('Single-report preparation disabled');await analysis.prepare();verify(true);if(smartCalls!==2)throw Error('Single report did not use server action');log('PASS: one-report summary; '+(scanMode?'2':'3')+' In range, 1 Out of range; no Hit or Miss wording; no trend invented; second-report note visible.');await pause('Test smart-summary failure');
 failSmart=true;await analysis.prepare();if(!root.querySelector('.real-summary-paper')||root.querySelector('.smart-summary-unavailable')?.textContent!=='Smart summary unavailable right now')throw Error('Failure hid the plain summary');log('PASS: simulated writing-call failure preserves the plain summary and visibly says Smart summary unavailable right now.');log('PASS: report reading, OCR filter, vision limits/model and reading cache unchanged.');
 }catch(error){log('FAIL: '+error.message);}finally{client.action=realAction;}
};
</script></body></html>
